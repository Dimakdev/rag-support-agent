# Everything this case needs on one machine: n8n and a vector database.
#
#   docker compose up -d        ->  n8n on http://localhost:5678, Qdrant on http://localhost:6333
#
# The first visit to n8n creates the owner account. Then: Settings -> n8n API -> create a key, and
# put it in .env as N8N_API_KEY.
#
# Ports are overridable so this can run next to something already using 5678:
#   N8N_PORT=5679 QDRANT_PORT=6334 docker compose -p rag up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ${N8N_CONTAINER:-n8n-rag}
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - TZ=${TIMEZONE:-UTC}
      # n8n refuses all file access from nodes unless a folder is named here. This names exactly one,
      # and the corpus below is mounted read-only. Without it the markdown source fails with
      # "Access to the file is not allowed", which reads like a bug and is a setting.
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/corpus
      # An answer that went wrong is only debuggable if the run was kept.
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
    volumes:
      - n8n_rag_data:/home/node/.n8n
      # The documents the agent reads. Read-only: indexing never writes to your files.
      # Point this at your own folder when you stop using the sample corpus.
      - ./corpus:/data/corpus:ro
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${QDRANT_CONTAINER:-qdrant-rag}
    restart: unless-stopped
    ports:
      # 6333 is the REST API and the dashboard at /dashboard. 6334 is gRPC, unused here.
      # On a public machine, do not publish this at all: inside the compose network n8n reaches
      # Qdrant without it, and Qdrant has no authentication of its own.
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_rag_data:/qdrant/storage

volumes:
  n8n_rag_data:
  qdrant_rag_data:
